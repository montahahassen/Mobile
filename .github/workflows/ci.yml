name: GreenHouse CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  backend:
    name: Symfony Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo_pgsql
          coverage: none

      - name: Validate Composer
        working-directory: greenHouse
        run: composer validate --no-check-publish

      - name: Install dependencies
        working-directory: greenHouse
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Check PHP syntax
        working-directory: greenHouse
        run: find src -name "*.php" -print0 | xargs -0 -n1 php -l

  frontend:
    name: Flutter Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
  flutter-version: '3.47.7'

      - name: Install dependencies
        working-directory: application/greenhouse_app
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: application/greenhouse_app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: application/greenhouse_app
        run: flutter test
